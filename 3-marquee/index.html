<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinite Scrolling Marquee</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Infinite Scrolling Marquee</h1>
    <p>Hover the banner to pause it</p>
  </header>

  <div class="marquee">
    <div class="marquee-track">
      <!-- 4 identical sets of items: the animation moves by exactly one set, so the loop is seamless -->
      <span>CSS</span><span>JavaScript</span><span>Git</span><span>GitHub</span><span>VS Code</span><span>HTML</span>
      <span>CSS</span><span>JavaScript</span><span>Git</span><span>GitHub</span><span>VS Code</span><span>HTML</span>
      <span>CSS</span><span>JavaScript</span><span>Git</span><span>GitHub</span><span>VS Code</span><span>HTML</span>
      <span>CSS</span><span>JavaScript</span><span>Git</span><span>GitHub</span><span>VS Code</span><span>HTML</span>
    </div>
  </div>
</body>
</html>
